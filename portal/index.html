<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Partner Portal · The Upside Philly</title>
<link rel="icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Mulish:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* © 2026 Shirah M. Brown · UPS-SMB-26-7F3A9C */
:root{--ground:#F7EFEC;--paper:#F1E4E0;--ink:#2F2C2C;--muted:#6F6361;--rose:#B8406E;--line:#E7D3D1;--house:#FFFDFC;
  --body:"Mulish","Segoe UI",system-ui,sans-serif;--mono:ui-monospace,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--ground:#1C1918;--paper:#262120;--ink:#F3E9E6;--muted:#B9ABA7;--rose:#FF7FAE;--line:#3A3230;--house:#2A2423}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--body);background:var(--ground);color:var(--ink);line-height:1.6;display:grid;place-items:center;padding:32px 20px;-webkit-font-smoothing:antialiased}
.card{width:100%;max-width:440px;background:var(--house);border:1px solid var(--line);border-radius:14px;padding:40px 34px;text-align:center;display:grid;gap:18px;justify-items:center}
.mark{font-family:Marcellus,Georgia,serif;font-size:30px;line-height:1}
.mark b{font-family:var(--mono);color:var(--rose);font-size:26px}
.eyebrow{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--rose)}
h1{font-family:Marcellus,Georgia,serif;font-weight:400;font-size:28px;line-height:1.15}
p{font-size:15px;color:var(--muted);max-width:34ch}
.btn{display:inline-block;font-size:15px;font-weight:700;padding:13px 26px;border-radius:7px;background:var(--rose);color:#fff;text-decoration:none;transition:.18s}
.btn:hover{filter:brightness(.92)}
.btn:focus-visible,.back:focus-visible{outline:3px solid var(--rose);outline-offset:3px}
.small{font-size:13px}
.back{font-size:13px;color:var(--rose);text-decoration:none}
.back:hover{text-decoration:underline}
</style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-label="The Upside Philly"><b>&gt;</b> the_upside</div>
    <div class="eyebrow">Partner Portal</div>
    <h1>Outreach &amp; Digital Strategy</h1>
    <p>Prospects, client kits, proposals and bookings for partners.</p>
    <a class="btn" href="https://claude.ai/artifact/M4aV4PGc3pQFeMHpVTDafT" rel="noopener">Sign in to the workspace</a>
    <p class="small">Access is by invitation.</p>
    <a class="back" href="/">← Back to The Upside Philly</a>
  </main>
</body>
</html>
